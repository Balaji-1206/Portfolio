{% extends "admin/base.html" %}
{% block title %}Edit Contact{% endblock %}
{% block page_title %}Edit Contact Page{% endblock %}
{% block content %}
<div class="admin-form-wrap">
  <form method="POST" class="admin-form">
    <h3 class="form-section-title">Page Content</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Heading</label>
        <input type="text" name="contact_heading" value="{{ contact.contact_heading or '' }}">
      </div>
      <div class="form-group">
        <label>Subtext</label>
        <input type="text" name="contact_subtext" value="{{ contact.contact_subtext or '' }}">
      </div>
    </div>
    <h3 class="form-section-title">Contact Details</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ contact.email or '' }}">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ contact.phone or '' }}">
      </div>
    </div>
    <div class="form-group">
      <label>Location</label>
      <input type="text" name="location" value="{{ contact.location or '' }}" placeholder="City, Country">
    </div>
    <h3 class="form-section-title">Social Links</h3>
    <div class="form-row">
      <div class="form-group">
        <label>GitHub URL</label>
        <input type="url" name="github_url" value="{{ contact.github_url or '' }}">
      </div>
      <div class="form-group">
        <label>LinkedIn URL</label>
        <input type="url" name="linkedin_url" value="{{ contact.linkedin_url or '' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Twitter / X URL</label>
        <input type="url" name="twitter_url" value="{{ contact.twitter_url or '' }}">
      </div>
      <div class="form-group">
        <label>Instagram URL</label>
        <input type="url" name="instagram_url" value="{{ contact.instagram_url or '' }}">
      </div>
    </div>
    <div class="form-group">
      <label>Personal Website URL</label>
      <input type="url" name="website_url" value="{{ contact.website_url or '' }}">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Save Changes</button>
      <a href="{{ url_for('contact.index') }}" target="_blank" class="btn-outline">Preview →</a>
    </div>
  </form>
</div>
{% endblock %}
