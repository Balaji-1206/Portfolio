{% extends "admin/base.html" %}
{% block title %}Edit Home{% endblock %}
{% block page_title %}Edit Home Page{% endblock %}
{% block content %}
<div class="admin-form-wrap">
  <form method="POST" class="admin-form">
    <div class="form-row">
      <div class="form-group">
        <label>Greeting (e.g. "Hello, I'm")</label>
        <input type="text" name="greeting" value="{{ home.greeting or '' }}">
      </div>
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" name="name" value="{{ home.name or '' }}" required>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Title / Role</label>
        <input type="text" name="title" value="{{ home.title or '' }}">
      </div>
      <div class="form-group">
        <label>Subtitle</label>
        <input type="text" name="subtitle" value="{{ home.subtitle or '' }}">
      </div>
    </div>
    <div class="form-group">
      <label>Collaboration Text (shown as badge)</label>
      <input type="text" name="collab_text" value="{{ home.collab_text or '' }}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>CTA Button Text</label>
        <input type="text" name="cta_text" value="{{ home.cta_text or '' }}">
      </div>
      <div class="form-group">
        <label>CTA Button Link</label>
        <input type="text" name="cta_link" value="{{ home.cta_link or '' }}" placeholder="/projects">
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Save Changes</button>
      <a href="{{ url_for('home.index') }}" target="_blank" class="btn-outline">Preview →</a>
    </div>
  </form>
</div>
{% endblock %}
